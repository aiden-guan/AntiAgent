name: Release AntiAgent Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build AntiAgent.app, DMG, and ZIP
        run: |
          python3 -m antiagent build-dmg --out dist

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: AntiAgent ${{ github.ref_name }}
          files: |
            dist/AntiAgent.dmg
            dist/AntiAgent.pkg
            dist/AntiAgent.zip
          draft: false
          prerelease: false
          generate_release_notes: true
