name: Release AntiAgent Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: "utf-8"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build AntiAgent.app, DMG, and ZIP
        run: |
          python3 -m antiagent build-dmg --out dist

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/AntiAgent.dmg
            dist/AntiAgent.pkg
            dist/AntiAgent.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build AntiAgent Windows Package
        run: |
          python -m antiagent build-windows --out dist

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/AntiAgent-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build AntiAgent Linux Package
        run: |
          python -m antiagent build-linux --out dist

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/AntiAgent-Linux.tar.gz

  build-python:
    name: Build & Smoke-Install Python Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Validate version matches Git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -c '
          import os, sys
          from antiagent import __version__
          ref = os.environ.get("GITHUB_REF_NAME", "").lstrip("v")
          if ref and __version__ != ref:
              print(f"ERROR: Version mismatch! antiagent.__version__={__version__} but Git tag={ref}")
              sys.exit(1)
          print(f"Version verified: {__version__} == {ref}")
          '

      - name: Build sdist and wheel
        run: |
          python -m build --outdir dist

      - name: Smoke-install wheel in clean environment
        run: |
          python -m venv test_env
          test_env/bin/pip install dist/*.whl
          INSTALLED_VER=$(test_env/bin/python -c "import antiagent; print(antiagent.__version__)")
          echo "Installed version in clean environment: $INSTALLED_VER"
          test_env/bin/antiagent --help

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux, build-python]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: dist

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist

      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-artifacts
          path: dist

      - name: Extract Release Notes from CHANGELOG
        id: extract_notes
        run: |
          python3 -c '
          import re, sys
          from pathlib import Path

          tag = "${{ github.ref_name }}".lstrip("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"##\s+\[v?{re.escape(tag)}\][^\n]*\n([\s\S]*?)(?=\n##\s+\[|\Z)"
          m = re.search(pattern, changelog)
          notes = m.group(1).strip() if m else f"### What'\''s New in ${{ github.ref_name }}\n\nSee full changelog at https://github.com/aiden-guan/AntiAgent/blob/main/CHANGELOG.md"

          installer_table = """
          ---

          ### 📥 Which download is right for you?

          | Package | Operating System | Description |
          | :--- | :--- | :--- |
          | **`AntiAgent.dmg`** | **macOS** | **Recommended for Mac**. Drag-and-drop installer to `/Applications`. |
          | **`AntiAgent-Windows.zip`** | **Windows (Public Beta)** | **Recommended for Windows (Beta)**. Extract and double-click `AntiAgent.bat`. |
          | **`AntiAgent-Linux.tar.gz`** | **Linux** | **Recommended for Linux**. Standalone archive with native desktop launcher and XDG registration. |
          | **`AntiAgent.pkg`** | **macOS** | Standard auto-launching installer package for enterprise / MDM. |
          | **`AntiAgent.zip`** | **macOS** | Standalone portable `.app` bundle archive. |
          | **`*.whl` / `*.tar.gz`** | **Cross-Platform** | Official Python package distribution archives. |

          > ℹ️ **Windows Support (Public Beta)**: The Windows standalone app mode is currently in Public Beta. If you encounter any platform-specific quirks or edge cases, please submit an issue on GitHub!

          ---

          ### ⚡ 1-Line Terminal Installs
          - **macOS**: `curl -fsSL https://raw.githubusercontent.com/aiden-guan/AntiAgent/main/install.sh | bash`
          - **Linux**: `curl -fsSL https://raw.githubusercontent.com/aiden-guan/AntiAgent/main/install.sh | bash`
          - **Windows (PowerShell)**: `irm https://raw.githubusercontent.com/aiden-guan/AntiAgent/main/install.ps1 | iex`
          - **Cross-Platform CLI**: `pip install https://github.com/aiden-guan/AntiAgent/archive/refs/tags/${{ github.ref_name }}.tar.gz && antiagent install --global`
          """

          full_body = f"{notes}\n\n{installer_table.strip()}\n"
          Path("RELEASE_BODY.md").write_text(full_body, encoding="utf-8")
          '

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: AntiAgent ${{ github.ref_name }}
          body_path: RELEASE_BODY.md
          files: |
            dist/AntiAgent.dmg
            dist/AntiAgent.pkg
            dist/AntiAgent.zip
            dist/AntiAgent-Windows.zip
            dist/AntiAgent-Linux.tar.gz
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: false
